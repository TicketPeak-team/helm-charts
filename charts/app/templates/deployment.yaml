apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.service.name }}-webapp
spec:
  replicas: {{ .Values.app.pod.initialCount }}
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: {{ .Values.app.service.name }}-webapp
  template:
    metadata:
      labels:
        app: {{ .Values.app.service.name }}-webapp
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - {{ .Values.app.service.name }}-webapp
              topologyKey: "kubernetes.io/hostname"
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {{ .Values.app.service.name }}-webapp
                topologyKey: "topology.kubernetes.io/zone"
      {{- if .Values.iam.service_account_name }}
      serviceAccountName:  {{ .Values.iam.service_account_name }}
      {{ end }}
      terminationGracePeriodSeconds: 30
      shareProcessNamespace: true
      volumes:
        - name: apache-logs
          emptyDir: {}
        - name: efs
          persistentVolumeClaim:
            claimName: efs-pv-{{ .Release.Namespace }}
        - name: parsers
          configMap:
            name: fluent-bit-parsers
      securityContext:
        fsGroup: 33
      nodeSelector:
        ticketpeak/node_type: {{ .Release.Namespace }}
      tolerations:
        - key: "ticketpeak/node_type"
          operator: "Equal"
          value: "{{ .Release.Namespace }}"
          effect: "NoSchedule"
      containers:
      - name: {{ .Values.app.service.name }}-webapp
        image: "{{ .Values.image.url }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
        volumeMounts:
          - name: efs
            mountPath: /var/www/html/storage
          - name: apache-logs
            mountPath: /var/log/apache
        imagePullPolicy: Always
        command:
          - "/bin/bash"
          - "-c"
          - "aws s3 cp s3://149536470129-ticketpeak-env/{{ .Release.Namespace }}/.env /var/www/html/.env && /usr/local/bin/startup.sh"
        ports:
          - containerPort: {{ .Values.app.pod.port }}
        {{- if .Values.app.is_network_service }}
        # --- Health Probes -------------------------------------------------
        # Liveness probe hits /livez
        livenessProbe:
          httpGet:
            path: /livez
            port: {{ .Values.app.pod.port }}
          timeoutSeconds: 10
          initialDelaySeconds: 15
          periodSeconds: 10
        # Readiness probe hits /readyz
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.app.pod.port }}
          timeoutSeconds: 10
          initialDelaySeconds: 15
          successThreshold: 2
          periodSeconds: 10
        {{- end }}
        resources:
          requests:
            memory: {{ .Values.app.resources.requests.memory }}
            cpu: {{ .Values.app.resources.requests.cpu }}
          limits:
            memory: {{ .Values.app.resources.limits.memory }}
            cpu: {{ .Values.app.resources.limits.cpu }}
        envFrom:
          - secretRef:
              name: {{ .Values.app.secretName }}
        securityContext:
          capabilities:
            drop:
              - all
      restartPolicy: Always
status: {}
