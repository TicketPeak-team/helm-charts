apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.service.name }}-webapp
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.app.pod.initialCount }}
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: {{ .Values.app.service.name }}-webapp
  template:
    metadata:
      labels:
        app: {{ .Values.app.service.name }}-webapp
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - {{ .Values.app.service.name }}-webapp
              topologyKey: "kubernetes.io/hostname"
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {{ .Values.app.service.name }}-webapp
                topologyKey: "topology.kubernetes.io/zone"
      {{- if .Values.iam.service_account_name }}
      serviceAccountName:  {{ .Values.iam.service_account_name }}
      {{ end }}
      terminationGracePeriodSeconds: 30
      shareProcessNamespace: true
      volumes:
        - name: apache-logs
          emptyDir: {}
        - name: efs
          persistentVolumeClaim:
            claimName: efs-pv-{{ .Release.Namespace }}
        - name: parsers
          configMap:
            name: fluent-bit-parsers
        - name: aws-iam-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
      securityContext:
        fsGroup: 33
      containers:
      - name: {{ .Values.app.service.name }}-webapp
        image: "{{ .Values.image.url }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
        volumeMounts:
          - name: efs
            mountPath: /var/www/html/storage
          - name: apache-logs
            mountPath: /var/log/apache
          - name: aws-iam-token
            mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
            readOnly: true
        imagePullPolicy: Always
        command:
          - "/bin/bash"
          - "-c"
          - "aws s3 cp s3://149536470129-ticketpeak-env/{{ .Release.Namespace }}/.env /var/www/html/.env && /usr/local/bin/startup.sh"
        ports:
          - containerPort: {{ .Values.app.pod.port }}
        {{- if .Values.app.is_network_service }}
        # --- Health Probes -------------------------------------------------
        # Liveness probe hits /livez
        livenessProbe:
          httpGet:
            path: /livez
            port: {{ .Values.app.pod.port }}
          initialDelaySeconds: 45
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 5
        # Readiness probe hits /readyz
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.app.pod.port }}
          initialDelaySeconds: 45
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 5
        {{- end }}
        resources:
          requests:
            memory: {{ .Values.app.resources.requests.memory }}
            cpu: {{ .Values.app.resources.requests.cpu }}
          limits:
            memory: {{ .Values.app.resources.limits.memory }}
            cpu: {{ .Values.app.resources.limits.cpu }}
        env:
          - name: LOG_CHANNEL
            value: single_json
        envFrom:
          - secretRef:
              name: {{ .Values.app.secretName }}
        securityContext:
          capabilities:
            drop:
              - all
      - name: fluent-bit-sidecar
        image: amazon/aws-for-fluent-bit:latest
        env:
          - name: AWS_REGION
            value: "us-east-1"
        volumeMounts:
          - name: apache-logs
            mountPath: /var/log/apache
          - name: parsers
            mountPath: /fluent-bit/etc/parsers.conf
            subPath: parsers.conf
        resources:
          requests:
            cpu: "250m"
          limits:
            cpu: "250m"
        command:
          - /fluent-bit/bin/fluent-bit
          - -v
          - -i
          - tail
          - -p
          - path=/var/log/apache/access_log
          - -p
          - parser=apache
          - -p
          - tag=apache.access
          - -i
          - tail
          - -p
          - path=/var/log/apache/error_log
          - -p
          - tag=apache.error
          - -o
          - cloudwatch_logs
          - -p
          - region=us-east-1
          - -p
          - log_group_name=/aws/eks/{{ .Release.Namespace }}/
          - -p
          - log_stream_prefix=${HOSTNAME}
          - -p
          - auto_create_group=true
          - -p
          - Match=*
          - -R
          - /fluent-bit/etc/parsers.conf
      restartPolicy: Always
status: {}
