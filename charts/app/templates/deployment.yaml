apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.service.name }}-webapp
spec:
  revisionHistoryLimit: 3
  replicas: {{ .Values.app.pod.initialCount }}
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: {{ .Values.app.service.name }}-webapp
  template:
    metadata:
      labels:
        app: {{ .Values.app.service.name }}-webapp
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - {{ .Values.app.service.name }}-webapp
              topologyKey: "kubernetes.io/hostname"
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {{ .Values.app.service.name }}-webapp
                topologyKey: "topology.kubernetes.io/zone"
      {{- if .Values.iam.service_account_name }}
      serviceAccountName:  {{ .Values.iam.service_account_name }}
      {{ end }}
      terminationGracePeriodSeconds: 30
      shareProcessNamespace: true
      volumes:
        - name: apache-logs
          emptyDir: { }
        - name: efs
          persistentVolumeClaim:
            claimName: efs-pv-{{ .Release.Namespace }}
        - name: parsers
          configMap:
            name: fluent-bit-parsers
        - name: aws-iam-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
      containers:
      - name: {{ .Values.app.service.name }}-webapp
        image: "{{ .Values.image.url }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
        volumeMounts:
          - name: efs
            mountPath: /var/www/html/storage
          - name: apache-logs
            mountPath: /var/log/apache
          - name: aws-iam-token
            mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
            readOnly: true
        imagePullPolicy: Always
        command:
          - "/bin/bash"
          - "-c"
          - "aws s3 cp s3://149536470129-ticketpeak-env/{{ .Release.Namespace }}/.env /var/www/html/.env && /var/www/html/startup.sh"
        ports:
          - containerPort: {{ .Values.app.pod.port }}
        {{ if .Values.app.is_network_service }}
        livenessProbe:
          httpGet:
            path: {{ .Values.app.pod.livenessPath }}
            port: {{ .Values.app.pod.port }}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: {{ .Values.app.pod.readinessPath }}
            port: {{ .Values.app.pod.port }}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        {{ end }}
        resources:
          requests:
            memory: {{ .Values.app.resources.requests.memory }}
            cpu: {{ .Values.app.resources.requests.cpu }}
          limits:
            memory: {{ .Values.app.resources.limits.memory }}
            cpu: {{ .Values.app.resources.limits.cpu }}
        env:
          - name: LOG_CHANNEL
            value: single_json
          - name: LOG_REQUEST
            value: "true"
          - name: LOG_RESPONSE
            value: "true"
          - name: REFRESH_PODS
            value: "20250929142700"
        envFrom:
          - secretRef:
              name: {{ .Values.app.secretName }}
        securityContext:
          capabilities:
            drop:
              - all
      restartPolicy: Always
status: { }
