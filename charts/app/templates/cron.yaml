apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.service.name }}-cron
spec:
  revisionHistoryLimit: 3
  replicas: 1
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: {{ .Values.app.service.name }}-cron
  template:
    metadata:
      labels:
        app: {{ .Values.app.service.name }}-cron
    spec:
      {{- if .Values.iam.service_account_name }}
      serviceAccountName:  {{ .Values.iam.service_account_name }}
      {{ end }}
      terminationGracePeriodSeconds: 30
      shareProcessNamespace: true
      volumes:
        - name: app-env
          emptyDir: {}
        - name: efs
          persistentVolumeClaim:
            claimName: efs-pv-{{ .Release.Namespace }}
        - name: aws-iam-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 86400
                  path: token
      initContainers:
        - name: load-env-from-s3
          image: amazon/aws-cli:2.15.37
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/bash"
            - "-c"
            - "aws s3 cp s3://149536470129-ticketpeak-env/{{ .Release.Namespace }}/.env /env/.env"
          env:
            - name: AWS_REGION
              value: "us-east-1"
          envFrom:
            - secretRef:
                name: {{ .Values.app.secretName }}
          volumeMounts:
            - name: app-env
              mountPath: /env
            - name: aws-iam-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
      containers:
        - name: {{ .Values.app.service.name }}-cron
          image: "{{ .Values.image.url }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          volumeMounts:
            - name: efs
              mountPath: /var/www/html/storage
            - name: app-env
              mountPath: /var/www/html/.env
              subPath: .env
          imagePullPolicy: Always
          command:
            - "/bin/bash"
            - "-c"
            - "/var/www/html/cron.sh"
          ports:
            - containerPort: {{ .Values.app.pod.port }}
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 4Gi
              cpu: 1024m
          env:
            - name: LOG_CHANNEL
              value: single_json
            - name: REFRESH_PODS
              value: "20250926092900"
          envFrom:
            - secretRef:
                name: {{ .Values.app.secretName }}
          securityContext:
            capabilities:
              drop:
                - all
      restartPolicy: Always
status: { }
