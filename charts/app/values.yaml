# helm-charts/charts/app/values.yaml   ← commit this in the *staging* branch
stack_name: ticketpeak-app-staging

image:
  url: 149536470129.dkr.ecr.us-east-1.amazonaws.com
  name: ticketpeak
  tag: staging                # argocd-image-updater will still bump this

app:
  is_network_service: true
  volume_id:
  command: []
  pod:
    initialCount: 1
    port: 8080                # <─ probes & service use this
  service:
    name: ticketpeak-app-staging
    protocol: TCP
    port: 8080
  resources:
    requests:
      memory: "1Gi"
      cpu:    "500m"
    limits:
      memory: "4Gi"
      cpu:    "1000m"
  secretName: ticketpeak-app-staging
  database_secret_names_to_use: []

iam:
  service_account_role: arn:aws:iam::149536470129:role/ticketpeak-app-staging
  service_account_name: ticketpeak-app-staging

env_bucket_name: 149536470129-ticketpeak-env

efs:
  file_system_id: fs-03419841abe2eed65
