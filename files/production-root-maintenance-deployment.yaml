apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketpeak-app-production-maintenance
  namespace: production
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ticketpeak-app-production-maintenance
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ticketpeak-app-production-maintenance
    spec:
      containers:
      - command:
        - /bin/bash
        - -c
        - sleep infinity
        envFrom:
        - secretRef:
            name: ticketpeak-app-production
        image: 149536470129.dkr.ecr.us-east-1.amazonaws.com/ticketpeak:production-4434b6682da2da9ace72abc46bcf1752e8c90f0b
        imagePullPolicy: Always
        name: ticketpeak-app-production-maintenance
        resources:
          limits:
            cpu: "6"
            memory: 14500Mi
          requests:
            cpu: "6"
            memory: 14500Mi
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: efs
          mountPath: /var/www/html/storage
        - mountPath: /var/log/apache
          name: apache-logs
      nodeSelector:
        ticketpeak/node_type: production
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: ticketpeak-app-production
      serviceAccountName: ticketpeak-app-production
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: ticketpeak/node_type
        operator: Equal
        value: production
      volumes:
      - name: efs
        persistentVolumeClaim:
          claimName: efs-pv-production
      - emptyDir: {}
        name: apache-logs
      - configMap:
          defaultMode: 420
          name: fluent-bit-parsers
        name: parsers
